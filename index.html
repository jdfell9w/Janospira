<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Janospira v3 Future Attractor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
#renderCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#overlay {
  position: absolute;
  top: 14px;
  left: 14px;
  max-width: 390px;
  padding: 14px 16px;
  color: #d8f7ff;
  background: rgba(0,0,0,0.54);
  border: 1px solid rgba(120,220,255,0.25);
  border-radius: 16px;
  z-index: 10;
}
#overlay h1 {
  margin: 0 0 8px 0;
  font-size: 20px;
  color: #8feaff;
}
#overlay .info {
  color: #ffc27d;
  font-size: 14px;
  line-height: 1.45;
}
</style>
</head>

<body>
<div id="overlay">
  <h1>Janospira v3</h1>
  <div class="info">
    Front view preserved.<br>
    Panels load from <b>panels/</b> and face the viewer.<br>
    Floating title corrected forward only.
  </div>
</div>

<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, {
  preserveDrawingBuffer: true,
  stencil: true,
  antialias: true
});
engine.setHardwareScalingLevel(1.0);

const GLB_FILE = "janospira_v3_future_attractor_floating_title.glb?v=13";
const PANEL_FOLDER = "panels/";
const PANEL_VERSION = "?v=13";

// Tries panel_0.png first, then panel-0.png, then panel0.png.
function panelCandidates(i) {
  return [
    PANEL_FOLDER + "panel_" + i + ".png",
    PANEL_FOLDER + "panel-" + i + ".png",
    PANEL_FOLDER + "panel" + i + ".png"
  ];
}

function makePanelMaterial(scene, name, index) {
  const mat = new BABYLON.StandardMaterial(name + "_mat", scene);
  mat.backFaceCulling = false;
  mat.disableLighting = true;
  mat.diffuseColor = new BABYLON.Color3(1, 1, 1);
  mat.emissiveColor = new BABYLON.Color3(1, 1, 1);

  const urls = panelCandidates(index);
  let n = 0;

  function tryLoad() {
    const url = urls[n] + PANEL_VERSION;

    const tex = new BABYLON.Texture(
      url,
      scene,
      false,
      false,
      BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
      () => {
        console.log("Loaded panel", index, url);

        // Fix upside-down panel images.
        mat.diffuseTexture = tex;
        mat.emissiveTexture = tex;
      },
      () => {
        console.warn("Failed panel", index, url);
        n++;
        if (n < urls.length) {
          tryLoad();
        }
      }
    );

    tex.hasAlpha = false;
  }

  tryLoad();
  return mat;
}

function makePanel(scene, name, index, x, y, z, width, height) {
  // Plane is placed behind the exhibit at z=positive.
  // Rotated around Y so the image face looks toward the viewer at z=negative.
  const panel = BABYLON.MeshBuilder.CreatePlane(name, {
    width: width,
    height: height,
    sideOrientation: BABYLON.Mesh.DOUBLESIDE
  }, scene);

  panel.position = new BABYLON.Vector3(x, y, z);
  panel.rotation.y = Math.PI;
  panel.rotation.z = Math.PI; // rotate each panel image 180 degrees
  panel.material = makePanelMaterial(scene, name, index);
  panel.parent = panelRoot;

  // Dark backing behind the image plane.
  const backing = BABYLON.MeshBuilder.CreateBox(name + "_backing", {
    width: width + 0.08,
    height: height + 0.08,
    depth: 0.035
  }, scene);

  backing.position = new BABYLON.Vector3(x, y, z + 0.035);
  backing.rotation.y = Math.PI;

  const backMat = new BABYLON.StandardMaterial(name + "_back_mat", scene);
  backMat.diffuseColor = new BABYLON.Color3(0.01, 0.014, 0.02);
  backMat.emissiveColor = new BABYLON.Color3(0.004, 0.005, 0.008);
  backing.material = backMat;
  backing.parent = panelRoot;

  return panel;
}

function addPanelWall(scene) {
  panelRoot = new BABYLON.TransformNode("webPanelRoot", scene);

  const aspect = 1792 / 1024;

  // Behind sculpture relative to starting camera.
  const z = 5.2;

  const heroH = 2.65;
  const heroW = heroH * aspect;

  const sideH = 1.30;
  const sideW = sideH * aspect;

  const leftX = -4.85;
  const rightX = 4.85;

  makePanel(scene, "web_panel_0_hero", 0, 0, 2.55, z, heroW, heroH);

  makePanel(scene, "web_panel_1_left_top", 1, leftX, 4.05, z, sideW, sideH);
  makePanel(scene, "web_panel_2_left_mid", 2, leftX, 2.55, z, sideW, sideH);
  makePanel(scene, "web_panel_3_left_low", 3, leftX, 1.05, z, sideW, sideH);

  makePanel(scene, "web_panel_4_right_top", 4, rightX, 4.05, z, sideW, sideH);
  makePanel(scene, "web_panel_5_right_mid", 5, rightX, 2.55, z, sideW, sideH);
  makePanel(scene, "web_panel_6_right_low", 6, rightX, 1.05, z, sideW, sideH);
}


let panelRoot = null;
let panelsVisible = true;
let overlayVisible = true;

function setPanelsVisible(v) {
  panelsVisible = v;
  if (panelRoot) panelRoot.setEnabled(v);
}

function setOverlayVisible(v) {
  overlayVisible = v;
  const ov = document.getElementById("overlay");
  if (ov) ov.style.display = v ? "block" : "none";
}

function enableQuestControllerNavigation(scene, xr) {
  const axes = {};
  const deadZone = 0.18;
  const moveSpeed = 2.0;
  const turnSpeed = 1.8;
  const lastPress = {};

  function debounced(key) {
    const now = performance.now();
    if (!lastPress[key] || now - lastPress[key] > 450) {
      lastPress[key] = now;
      return true;
    }
    return false;
  }

  xr.input.onControllerAddedObservable.add((controller) => {
    controller.onMotionControllerInitObservable.add((motionController) => {
      const handedness = controller.inputSource.handedness || "unknown";
      const ids = motionController.getComponentIds();

      ids.forEach((id) => {
        const comp = motionController.getComponent(id);
        if (!comp) return;

        if (id.includes("thumbstick") || id.includes("touchpad")) {
          comp.onAxisValueChangedObservable.add((values) => {
            axes[handedness] = { x: values.x || 0, y: values.y || 0 };
          });
        }

        if (id.includes("trigger")) {
          comp.onButtonStateChangedObservable.add(() => {
            if (comp.changes && comp.changes.pressed && comp.pressed) {
              if (handedness === "left" && debounced("left_trigger")) {
                setPanelsVisible(!panelsVisible);
              }
              if (handedness === "right" && debounced("right_trigger")) {
                setOverlayVisible(!overlayVisible);
              }
            }
          });
        }
      });
    });
  });

  scene.onBeforeRenderObservable.add(() => {
    if (!xr.baseExperience || !xr.baseExperience.camera) return;

    const cam = xr.baseExperience.camera;
    const dt = engine.getDeltaTime() / 1000;

    const left = axes.left || {x:0, y:0};
    const right = axes.right || {x:0, y:0};

    const moveX = Math.abs(left.x) > deadZone ? left.x : 0;
    const moveY = Math.abs(left.y) > deadZone ? left.y : 0;

    if (moveX !== 0 || moveY !== 0) {
      const forward = cam.getDirection(BABYLON.Axis.Z);
      forward.y = 0;
      forward.normalize();

      const strafe = cam.getDirection(BABYLON.Axis.X);
      strafe.y = 0;
      strafe.normalize();

      const delta = forward.scale(-moveY * moveSpeed * dt).add(strafe.scale(moveX * moveSpeed * dt));
      cam.position.addInPlace(delta);
    }

    const turn = Math.abs(right.x) > deadZone ? right.x : 0;
    if (turn !== 0) {
      cam.rotation.y += turn * turnSpeed * dt;
    }
  });
}



function fixTitleOnlyPosition(scene) {
  // Fix only the floating Janospira title/nameplate objects.
  // Camera starts at z=-8, so negative Z moves the title toward the viewer/front.
  const TITLE_FORWARD_Z = -6;
  const TITLE_UP_Y = 0.02;

  scene.meshes.forEach(m => {
    const n = (m.name || "").toLowerCase();

    const isFloatingTitle =
      n.includes("janospira_floating") ||
      n.includes("janospira_title") ||
      n.includes("floating_title") ||
      n.includes("gold_endcap");

    if (isFloatingTitle) {
      m.position.z += TITLE_FORWARD_Z;
      m.position.y += TITLE_UP_Y;
    }
  });
}


const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.002, 0.002, 0.008, 1);

  scene.imageProcessingConfiguration.toneMappingEnabled = true;
  scene.imageProcessingConfiguration.toneMappingType =
    BABYLON.ImageProcessingConfiguration.TONEMAPPING_KHR_PBR_NEUTRAL;
  scene.imageProcessingConfiguration.exposure = 1.18;
  scene.imageProcessingConfiguration.contrast = 1.08;

  // Start from front of exhibit. Panels are behind sculpture at z=+5.2.
  const camera = new BABYLON.UniversalCamera(
    "camera",
    new BABYLON.Vector3(0, 1.7, -8.0),
    scene
  );
  camera.setTarget(new BABYLON.Vector3(0, 1.4, 0.4));
  camera.attachControl(canvas, true);
  camera.speed = 0.20;
  camera.angularSensibility = 3500;
  camera.minZ = 0.05;

  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.88;

  const cyan = new BABYLON.PointLight("cyan", new BABYLON.Vector3(5, 7, -4), scene);
  cyan.diffuse = new BABYLON.Color3(0.35, 0.80, 1.0);
  cyan.intensity = 38;

  const warm = new BABYLON.PointLight("warm", new BABYLON.Vector3(-5, 4, 4), scene);
  warm.diffuse = new BABYLON.Color3(1.0, 0.42, 0.10);
  warm.intensity = 32;

  const violet = new BABYLON.PointLight("violet", new BABYLON.Vector3(0, 3, 3), scene);
  violet.diffuse = new BABYLON.Color3(0.55, 0.12, 1.0);
  violet.intensity = 25;

  try {
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./", GLB_FILE, scene);

    const root = new BABYLON.TransformNode("janospiraRoot", scene);

    result.meshes.forEach(m => {
      if (m.name !== "__root__") {
        m.parent = root;
      }

      // Hide Blender-made blank/mirrored panel planes and backings.
      const n = (m.name || "").toLowerCase();
      if (
        n.includes("panel_") ||
        n.includes("panel-") ||
        n.includes("hero_clockspring") ||
        n.includes("thin_backing")
      ) {
        m.setEnabled(false);
      }
    });

    root.position.y = 0;
    root.scaling = new BABYLON.Vector3(1, 1, 1);

    fixTitleOnlyPosition(scene);

  } catch (e) {
    console.error(e);
    alert("Failed to load " + GLB_FILE + ". Put index.html in the same folder as the GLB.");
  }

  // Web-loaded corrected panels.
  addPanelWall(scene);

  try {
    const xr = await scene.createDefaultXRExperienceAsync({ floorMeshes: [] });
    enableQuestControllerNavigation(scene, xr);
  } catch (e) {
    console.log("XR unavailable:", e);
  }

  return scene;
};

createScene().then(scene => engine.runRenderLoop(() => scene.render()));
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
